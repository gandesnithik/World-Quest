<script>
const $=id=>document.getElementById(id);
const coarse=matchMedia('(pointer:coarse)').matches;
const WL=-1.2,DAY=120,TOTAL=DAY*3;
const CH=[{n:'Ranger',s:0x3d6b3a,p:0x4a3b2a,h:0xd9a77a,x:0},{n:'Scout',s:0xb5452f,p:0x2b3a55,h:0x8a5a3c,x:1},{n:'Medic',s:0xe8e8e0,p:0x5a5a62,h:0xf0c8a0,x:2}];
const TY={apple:['Apple','🍎',[12,4,0]],berry:['Berries','🫐',[8,3,1]],mushroom:['Mushroom','🍄',[10,0,2]],bread:['Bread','🍞',[28,0,0]],meat:['Meat','🍖',[35,0,3]],fish:['Fish','🐟',[30,0,3]],water:['Water bottle','💧',[0,45,0]],wood:['Wood','🪵'],stone:['Stone','🪨'],leaf:['Leaves','🍃']};
const NEED={wood:10,stone:6};
const SH={x:24,z:-18};
let chI=0;try{chI=+localStorage.getItem('w72ch')||0}catch(e){}
let mode='menu',R=null,room=null,isHost=false,code='',seed='x',T0=0,fin=0,shadowsOn=true,soundOn=true;
let me=null,P=null,OBJ=null,COL=[],ITEMS=[],remotes={},K={},runT=false,jx=0,jy=0,cy=0,cp=.35,act=0,mrot=0,lastPres=0,drag=false;

/* ---------- helpers ---------- */
function mk(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hs(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function ntex(rep,streak){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#c8c8c8';x.fillRect(0,0,256,256);
 for(let i=0;i<7000;i++){const v=90+Math.random()*165|0;x.fillStyle=`rgba(${v},${v},${v},.35)`;streak?x.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*2,10+Math.random()*40):x.fillRect(Math.random()*256,Math.random()*256,2,2)}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.anisotropy=4;return t}
const sm=(a,b,v)=>{v=Math.min(1,Math.max(0,(v-a)/(b-a)));return v*v*(3-2*v)};
function th(x,z){const d=Math.hypot(x,z);
 let h=Math.sin(x*.021)*Math.cos(z*.017)*7+Math.sin(x*.057+z*.043)*2.2+Math.cos(x*.11-z*.09)*.8+Math.sin(x*.008+1)*Math.cos(z*.009)*12;
 const m=sm(14,44,d);h=1+(h-1)*m;
 h-=9*Math.exp(-((x-55)**2+(z+35)**2)/650)+9*Math.exp(-((x+70)**2+(z-60)**2)/800)+7*Math.exp(-((x-10)**2+(z-95)**2)/500);
 h+=Math.max(0,d-140)*.55;return h}

/* ---------- three setup ---------- */
const cv=$('c'),rd=new THREE.WebGLRenderer({canvas:cv,antialias:true});
rd.setPixelRatio(Math.min(devicePixelRatio,2));rd.shadowMap.enabled=true;rd.shadowMap.type=THREE.PCFSoftShadowMap;
rd.outputEncoding=THREE.sRGBEncoding;rd.toneMapping=THREE.ACESFilmicToneMapping;rd.toneMappingExposure=.95;
const sc=new THREE.Scene();sc.fog=new THREE.FogExp2(0x9ec5e6,.008);
const cam=new THREE.PerspectiveCamera(65,1,.1,700);
function rs(){rd.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
const hemi=new THREE.HemisphereLight(0xbfd8ff,0x40503a,.6);sc.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1d0,1.8);sun.castShadow=true;sun.shadow.mapSize.set(coarse?1024:2048,coarse?1024:2048);
Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,far:260});sun.shadow.bias=-.0006;sc.add(sun,sun.target);

/* terrain + water (same for everyone) */
(function(){const g=new THREE.PlaneGeometry(420,420,210,210);g.rotateX(-Math.PI/2);const pa=g.attributes.position,cols=new Float32Array(pa.count*3),c=new THREE.Color();
 for(let i=0;i<pa.count;i++){const x=pa.getX(i),z=pa.getZ(i),h=th(x,z);pa.setY(i,h);const sl=Math.abs(th(x+1.5,z)-h)+Math.abs(th(x,z+1.5)-h);
  if(h<-.7)c.setHex(0x6e6246);else if(h<.2)c.setHex(0xb0a070);else if(h>34)c.setHex(0xdfe4e6);else if(sl>2.1||h>24)c.setHex(0x7a746b);
  else c.setHSL(.26+.03*Math.sin(x*.3)*Math.cos(z*.3),.42,.26+.06*Math.sin(x*.13+z*.11)+(h>10?.02:0));
  cols.set([c.r,c.g,c.b],i*3)}
 g.setAttribute('color',new THREE.BufferAttribute(cols,3));g.computeVertexNormals();
 const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,map:ntex(110),roughness:1}));m.receiveShadow=true;sc.add(m)})();
const wt=ntex(40);const water=new THREE.Mesh(new THREE.PlaneGeometry(420,420).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:0x2d7a9a,map:wt,roughness:.12,metalness:.35,transparent:true,opacity:.85}));water.position.y=WL;sc.add(water);
const clouds=new THREE.Group(),cmat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.85,fog:false});
for(let i=0;i<16;i++){const g=new THREE.Group();for(let j=0;j<5;j++){const s=new THREE.Mesh(new THREE.SphereGeometry(8+Math.random()*8,10,8),cmat);s.position.set(j*10-20,Math.random()*3,Math.random()*8);s.scale.y=.45;g.add(s)}g.position.set(Math.random()*500-250,85+Math.random()*25,Math.random()*500-250);clouds.add(g)}sc.add(clouds);
const BARK=ntex(1,true),stars=(()=>{const a=[];for(let i=0;i<800;i++){const u=Math.random()*6.28,v=Math.random()*1.4;a.push(Math.cos(u)*Math.cos(v)*500,Math.sin(v)*500,Math.sin(u)*Math.cos(v)*500)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));const p=new THREE.Points(g,new THREE.PointsMaterial({size:1.8,sizeAttenuation:false,transparent:true,fog:false,depthWrite:false}));sc.add(p);return p})();

/* ---------- people ---------- */
function person(ch){const g=new THREE.Group(),M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});
 const B=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);g.add(m);return m};
 B(.7,.9,.38,ch.s,0,1.45,0);const head=new THREE.Mesh(new THREE.SphereGeometry(.24,18,14),M(ch.h));head.position.y=2.15;g.add(head);
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.26,18,10,0,6.3,0,1.3),M(ch.x==2?0xb8742e:0x2a1e16));hair.position.y=2.17;hair.rotation.x=-.25;g.add(hair);
 const lim=(w,h,d,c,x,y)=>{const p=new THREE.Group();p.position.set(x,y,0);const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.y=-h/2;p.add(m);g.add(p);return p};
 const lL=lim(.29,.95,.3,ch.p,-.17,1),lR=lim(.29,.95,.3,ch.p,.17,1),aL=lim(.22,.8,.22,ch.s,-.48,1.85),aR=lim(.22,.8,.22,ch.s,.48,1.85);
 if(ch.x==0){B(.7,.05,.7,0x5a4a2a,0,2.34,0);B(.38,.28,.38,0x5a4a2a,0,2.46,0)}
 if(ch.x==1)B(.5,.6,.25,0x3a4a2a,0,1.5,-.32);
 if(ch.x==2){const t=new THREE.Mesh(new THREE.SphereGeometry(.1,8,8),M(0xb8742e));t.position.set(0,2.1,-.3);g.add(t);B(.2,.2,.02,0xcc2222,0,1.5,.2)}
 g.traverse(o=>{if(o.isMesh)o.castShadow=true});g.scale.setScalar(.75);g.userData={lL,lR,aL,aR,ph:0};return g}
function label(t){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.font='bold 30px system-ui';x.textAlign='center';x.fillStyle='#0008';x.fillRect(0,8,256,48);x.fillStyle='#fff';x.fillText(t,128,44);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(2.2,.55,1);s.position.y=3.1;s.renderOrder=9;return s}
function anim(g,sp,dt,a){const u=g.userData;u.ph+=sp*dt*1.5;const k=Math.min(1,sp/4)*.9;u.lL.rotation.x=Math.sin(u.ph)*k;u.lR.rotation.x=-Math.sin(u.ph)*k;u.aL.rotation.x=-Math.sin(u.ph)*k*.8;u.aR.rotation.x=a>0?-2.3*Math.sin(Math.min(1,a)*Math.PI*.9+.1):Math.sin(u.ph)*k*.8}
const MC=CH.map((c,i)=>{const p=person(c);p.position.set((i-1)*2.4,1,0);sc.add(p);return p});

/* ---------- world objects ---------- */
function mkItem(t){const g=new THREE.Group(),M=(c,r=.7,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r},o));
 const S=r=>new THREE.SphereGeometry(r,16,12),add=(geo,mat,x=0,y=0,z=0,s)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);if(s)m.scale.set(...s);m.castShadow=true;g.add(m);return m};
 if(t=='apple'){add(S(.17),M(0xc4271f,.35),0,.17);add(new THREE.CylinderGeometry(.01,.013,.1),M(0x4a3320),0,.36);add(S(.04),M(0x3a7d2a),.05,.35,0,[1,.4,1.6])}
 if(t=='berry')[[0,0],[.12,.05],[.05,-.12]].forEach(([x,z])=>add(S(.07),M(0x5a2a8a,.3),x,.07,z));
 if(t=='mushroom'){add(new THREE.CylinderGeometry(.05,.07,.18,10),M(0xe9e0cc),0,.09);add(new THREE.SphereGeometry(.14,14,8,0,6.283,0,1.57),M(0xc0392b,.5),0,.18)}
 if(t=='bread'){add(S(.2),M(0xc98a3d,.9),0,.14,0,[1.4,.7,.8])}
 if(t=='meat'){add(S(.2),M(0xa83a3a,.45),0,.15,0,[1.2,.75,.9]);add(new THREE.CylinderGeometry(.03,.03,.3),M(0xf0ead8),.3,.15).rotation.z=1.57}
 if(t=='fish'){add(S(.2),M(0x9fb4c4,.3,{metalness:.6}),0,.1,0,[1.8,.55,.5]);add(new THREE.ConeGeometry(.12,.22,3),M(0x7f94a4),.45,.1).rotation.z=-1.57}
 if(t=='water'){add(new THREE.CylinderGeometry(.07,.07,.3,12),M(0x6fb6e8,.1,{transparent:true,opacity:.65}),0,.15);add(new THREE.CylinderGeometry(.045,.045,.06,10),M(0xeeeeee),0,.33)}
 if(t=='wood'){add(new THREE.CylinderGeometry(.1,.11,.9,8),M(0x7a5a3a,1,{map:BARK}),0,.12).rotation.z=1.57;add(new THREE.CylinderGeometry(.08,.09,.8,8),M(0x6b4a2b,1,{map:BARK}),0,.25,.1).rotation.set(0,.5,1.57)}
 if(t=='stone')add(new THREE.DodecahedronGeometry(.2),M(0x8d8d88,1,{flatShading:true}),0,.13,0,[1.2,.8,1]);
 if(t=='leaf'){const l=add(new THREE.PlaneGeometry(.35,.5),M(0x4f8a2e,.8,{side:THREE.DoubleSide}),0,.04);l.rotation.x=-1.4;add(new THREE.PlaneGeometry(.3,.45),M(0x3f7a22,.8,{side:THREE.DoubleSide}),.15,.05,.1).rotation.set(-1.5,0,.8)}
 return g}
function build(sd){if(OBJ)sc.remove(OBJ);OBJ=new THREE.Group();sc.add(OBJ);COL=[];ITEMS=[];const r=mk(hs(sd)),D=new THREE.Object3D(),C=new THREE.Color();
 const inst=(geo,mat,n)=>{const m=new THREE.InstancedMesh(geo,mat,n);m.castShadow=true;m.receiveShadow=true;OBJ.add(m);return m};
 const spot=(f,tries=400)=>{for(let i=0;i<tries;i++){const x=(r()-.5)*360,z=(r()-.5)*360,h=th(x,z);if(Math.hypot(x,z)>13&&Math.hypot(x-SH.x,z-SH.z)>9&&Math.hypot(x,z)<175&&f(h,x,z))return[x,h,z]}return null};
 const tp=[];for(let i=0;i<300;i++){const p=spot(h=>h>-.3&&h<20);if(p)tp.push(p)}
 const g=[new THREE.CylinderGeometry(.28,.45,6,7).translate(0,3,0),new THREE.ConeGeometry(2.3,4.2,8).translate(0,5.4,0),new THREE.ConeGeometry(1.7,3.6,8).translate(0,7.4,0),new THREE.ConeGeometry(1.1,2.8,8).translate(0,9.2,0)];
 const ms=[inst(g[0],new THREE.MeshStandardMaterial({map:BARK,color:0x6b4a30,roughness:1}),tp.length),...[1,2,3].map(i=>inst(g[i],new THREE.MeshStandardMaterial({roughness:.9}),tp.length))];
 tp.forEach(([x,h,z],i)=>{const s=.7+r()*.9;D.position.set(x,h-.2,z);D.rotation.set(0,r()*6,0);D.scale.set(s,s*(.9+r()*.3),s);D.updateMatrix();C.setHSL(.28+r()*.08,.5,.16+r()*.1);ms.forEach((m,k)=>{m.setMatrixAt(i,D.matrix);if(k)m.setColorAt(i,C)});COL.push({x,z,r:.5*s+.25})});
 const rp=[];for(let i=0;i<90;i++){const p=spot(h=>h>-.8);if(p)rp.push(p)}
 const rk=inst(new THREE.DodecahedronGeometry(1),new THREE.MeshStandardMaterial({color:0x8a8780,roughness:1,flatShading:true,map:ntex(2)}),rp.length);
 rp.forEach(([x,h,z],i)=>{const s=.6+r()*2.2;D.position.set(x,h+s*.25,z);D.rotation.set(r(),r()*6,r());D.scale.set(s*1.2,s*.8,s);D.updateMatrix();rk.setMatrixAt(i,D.matrix);COL.push({x,z,r:s*.9})});
